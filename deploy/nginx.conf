# /etc/nginx/sites-available/plurb — TLS certs from certbot.
server {
    listen 80;
    listen [::]:80;
    server_name plurb.org www.plurb.org;
    return 301 https://plurb.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.plurb.org;
    ssl_certificate     /etc/letsencrypt/live/plurb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plurb.org/privkey.pem;
    return 301 https://plurb.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plurb.org;

    ssl_certificate     /etc/letsencrypt/live/plurb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plurb.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Text only: no uploads, so keep request bodies small.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/rss+xml application/xml text/plain;

    # Server-Sent Events: no buffering, long reads (the app sends a heartbeat every 25s).
    location = /notifications/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The app's CSRF guard compares Origin against Host: pass it through.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
